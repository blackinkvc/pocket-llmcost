name: Agent 榜单刷新

on:
  schedule:
    - cron: "23 1 * * *"      # 每天 09:23（北京时间）抓一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_agent_stats.py

      - name: 重建 Agent 页面
        run: python tools/build_section.py --only agents

      - name: 有变化就提交
        run: |
          git config user.name "ai-track-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/agent agents.html
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "chore(agent): 刷新榜单数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
