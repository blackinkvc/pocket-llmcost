name: snapshot

# 每天把线上五页读的那份数据重算一遍。价格是日/周级变化，日更够用；
# 想立刻刷新就到 Actions 页面点一次 Run workflow。
on:
  schedule:
    - cron: "17 2 * * *" # 每天 02:17 UTC = 北京 10:17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "llmcost_core.py"
      - "llmcost.py"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 重算快照
        run: python3 tools/make_snapshot.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llmcost/data/data.json
          if git diff --staged --quiet; then
            echo "数据没变，不提交"
          else
            git commit -m "data: 刷新价格快照 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
