<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Token 价格追踪</title>
<!-- 由 cuntu/llmcost.py（:8776）现读；改完刷新即生效，不用重启服务 -->
<script>
(function(){
  var t='auto';
  try{ t = localStorage.getItem('cuntu_theme')||localStorage.getItem('lc_theme') || 'auto'; }catch(e){}
  var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<style>
/* ============================================================
   Token 价格追踪 · 研究简报风格
   墨色排印 + 朱砂点睛 + 纸感底；标题宋体，数字无衬线等宽数字。
   卡壳（.card / .card-h / .card-b / 四列网格）由 pgkit 的 shell.css 提供，
   这里只写内容：指标带、结论、表格、筛选、图。
   ============================================================ */
:root{
  color-scheme:light;
  --paper:#f2f0ea; --card:#fffdf9; --card2:#f8f6f1;
  --rule:#e2ded4; --rule2:#edeae2;
  --ink:#17191b; --ink2:#4e545b; --ink3:#676c74;
  --accent:#a33a26; --accent-soft:#f7ebe6;
  --ok:#2b6a4d; --warn:#8d6417; --bad:#a33a26; --vio:#6a5583;
  --r:14px; --r2:16px;
  --hair:1px solid var(--rule);
  --sh:0 1px 1px rgba(23,25,27,.03), 0 18px 40px -34px rgba(23,25,27,.5);
  --ease:cubic-bezier(.2,.7,.3,1);
  --font:-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Songti TC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121316; --card:#191b1e; --card2:#212327;
  --rule:#2b2d31; --rule2:#242629;
  --ink:#efede8; --ink2:#aeb4bc; --ink3:#949aa2;
  --accent:#d9785f; --accent-soft:#2a1f1c;
  --ok:#5cba8b; --warn:#cfa257; --bad:#e08268; --vio:#a894c6;
  --sh:0 1px 1px rgba(0,0,0,.5), 0 18px 40px -34px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"lnum" 1}
::selection{background:var(--accent-soft);color:var(--ink)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
a:hover{border-bottom-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
/* shell.css 把 .pg 的 max-width 清成 none（主页那套是全屏网格），插件页需要居中留白：
   选择器比 body .pg 多一个元素，才能压过它 */
body main.pg{max-width:1320px;margin:0 auto;padding:16px 20px 70px}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px) saturate(120%);
  background:color-mix(in srgb,var(--paper) 86%, transparent);
  border-bottom:1px solid var(--rule)}
.top .in{gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:17px;font-weight:600;
  letter-spacing:.04em;flex:0 0 auto;white-space:nowrap}
h1.brand{margin:0;line-height:1.2}
.brand i{width:6px;height:6px;background:var(--accent);flex:0 0 auto;transform:translateY(-2px)}
.sum{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:8px;min-width:0;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.01em}
.sum b{font-weight:600;color:var(--ink2)}
.sum .dot{width:2px;height:2px;border-radius:50%;background:var(--ink3);opacity:.6;flex:0 0 auto}
.grow{flex:1 1 auto;min-width:0}
@media (max-width:720px){.sum{display:none}}
.icobtn{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);
  transition:.15s var(--ease);flex:0 0 auto}
.icobtn:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.icobtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.icobtn[disabled]{opacity:.35;cursor:default}

/* ---------- 卡内通用 ---------- */
.hint{font-size:12.5px;color:var(--ink3);margin:0 0 12px;line-height:1.7;max-width:82ch}
/* 单表 / 单图卡：卡片主体改成纵向 flex，让表或图吃掉剩下的高度。
   这样「滚的是 .tscroll 自己」，表头才吸得住；图也不会被说明文字顶出卡外。
   :has() 只命中这两种卡，多块的卡（套餐 / 任务 / 校验）保持普通流。 */
.card-b:has(> .chart),.card-b:has(> .tscroll){display:flex;flex-direction:column;gap:8px;min-height:0}
.card-b > .hint{margin:0}
.card-b > .foot{margin-top:0}
.card-b:has(> .chart) > .chart{flex:1 1 auto;height:auto;min-height:0}
.card-b:has(> .tscroll) > .tscroll{flex:1 1 auto;min-height:0;max-height:none}
.hint b,.hint strong{color:var(--ink2);font-weight:600}
.mt{margin-top:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
/* 左右两栏各装一张表时，每张表自己滚 —— 否则两张都展开就没底了 */
.split .tscroll{max-height:260px}
#b-verify .tscroll{max-height:210px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.blk>h3{font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 8px;letter-spacing:.02em}
.eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}

/* ---------- 指标带 ---------- */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;
  background:var(--rule);border:var(--hair);border-radius:12px;overflow:hidden}
.strip .cell{background:var(--card);padding:11px 13px 12px;min-width:0}
.strip .k{font-size:10.5px;color:var(--ink3);letter-spacing:.05em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.strip b{display:block;font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.1;
  margin-top:5px;font-variant-numeric:tabular-nums}
.strip .f{font-size:10.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.4}
.strip .cell.ok b{color:var(--ok)} .strip .cell.bad b{color:var(--bad)}
.strip .cell.warn b{color:var(--warn)} .strip .cell.vio b{color:var(--vio)}
@media (max-width:1100px){.strip{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}}

/* ---------- 结论 ---------- */
.big{font-family:var(--serif);font-size:42px;line-height:1.06;letter-spacing:-.015em;margin-top:10px;
  font-weight:600}
.big small{font-family:var(--font);font-size:12px;color:var(--ink3);margin-left:6px;letter-spacing:0;
  font-weight:400}
.claim{font-size:13px;color:var(--ink2);line-height:1.8;margin-top:10px}
.claim b{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--rule2)}
@media (max-width:520px){.facts{grid-template-columns:1fr}}
.side-k{font-size:10.5px;letter-spacing:.05em;color:var(--ink3)}
.side-v{font-size:20px;font-weight:600;letter-spacing:-.015em;margin-top:5px;line-height:1.2}
.side-v small{font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:0;margin-left:4px}
.side-f{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.55}
.sbar{display:flex;gap:1px;height:5px;border-radius:3px;overflow:hidden;background:var(--rule2);
  margin-top:9px}
.pick{margin-top:14px;padding:10px 12px;border-left:2px solid var(--accent);
  background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:12px;line-height:1.7;
  color:var(--ink2)}
.pick b{color:var(--ink);font-weight:600}
.sbar i{display:block;height:100%}

/* ---------- 键值行（工作台那张卡的版式） ---------- */
.kv{display:flex;flex-direction:column}
.kv .row{display:flex;align-items:baseline;gap:12px;font-size:12.5px;padding:9px 0;
  border-bottom:1px solid var(--rule2)}
.kv .row:last-child{border-bottom:0}
.kv .k{color:var(--ink3);min-width:56px;flex:0 0 auto;font-size:11.5px;letter-spacing:.03em}
.kv .v{color:var(--ink);font-weight:500;min-width:0;line-height:1.55}
.kv .v b{font-weight:600}
.kv .v .sm{display:block;font-size:11px;color:var(--ink3);font-weight:400;margin-top:2px}

/* ---------- 图表：铺满卡片主体，随卡片缩放 ---------- */
.chart{position:relative;height:100%;min-height:180px;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.chart svg{display:block;width:100%;height:100%;max-height:100%}
.chart-hint{display:none}
@media (max-width:820px){
  /* 窄屏不再把 1000px 的图压成 5px 的字：保持接近原始尺寸，横向拖 */
  .chart{overflow-x:auto;justify-content:flex-start}
  .chart svg{width:auto;min-width:780px;height:100%}
  .chart-hint{display:block;font-size:11px;color:var(--ink3);margin:0 0 6px}
}

/* ---------- 筛选条 ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:27px;padding:0 10px;border-radius:7px;border:var(--hair);background:transparent;
  color:var(--ink2);font-size:12px;display:inline-flex;align-items:center;gap:6px;
  transition:.14s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:500}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.chip[data-st="confirmed"] i{background:var(--ok);opacity:1}
.chip[data-st="single_source"] i,.chip[data-st="stale"] i{background:var(--warn);opacity:1}
.chip[data-st="conflict"] i{background:var(--bad);opacity:1}
.chip[data-st="incomparable"] i{background:var(--vio);opacity:1}
.chip[data-st="unverified"] i,.chip[data-st="uncovered"] i{background:var(--ink3);opacity:1}
.chip em{font-style:normal;font-size:10.5px;opacity:.6}
.search{display:flex;align-items:center;gap:8px;height:27px;padding:0 9px;border-radius:7px;
  background:transparent;border:var(--hair);width:190px;transition:border-color .16s var(--ease)}
.search:focus-within{border-color:var(--ink3);outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);
  outline-offset:0}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:12px}
.search input::placeholder{color:var(--ink3)}

/* ---------- 表格 ---------- */
/* 表头要真正吸顶就得让 .tscroll 自己纵向滚；在卡里再限一次高度，
   免得一张 142 行的表把卡片撑成无底洞 */
/* 表头要吸顶，.tscroll 自己就得是滚动容器，而且高度得算得出来：
   shell 在卡片上挂了 --hcell，行高 --row 56、间距 --gap 16，
   减去卡头(44)与内边距(26)再加一点余量。不这么写的话卡片主体先滚起来，
   sticky 的参照系变成那个不滚的 .tscroll，表头照样跑掉。 */
.tscroll{max-height:calc(var(--hcell,6) * (var(--row,56px) + var(--gap,16px)) - 92px);
  overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -5px}
/* 横滑提示：手机上一列被切一半，看不出右边还有内容。
   用「local + scroll」两段背景做滚动阴影 —— 没滑到边时阴影在视野外不出来，
   滑到头就自动消失，不需要 JS。 */
.tscroll{background-image:
    linear-gradient(to right, var(--card) 30%, transparent),
    linear-gradient(to left, var(--card) 30%, transparent),
    radial-gradient(farthest-side at 0 50%, color-mix(in srgb, var(--ink) 24%, transparent), transparent),
    radial-gradient(farthest-side at 100% 50%, color-mix(in srgb, var(--ink) 24%, transparent), transparent);
  background-position:left center, right center, left center, right center;
  background-size:28px 100%, 28px 100%, 13px 100%, 13px 100%;
  background-repeat:no-repeat;
  background-attachment:local, local, scroll, scroll}
table.dt{width:auto;min-width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;font-weight:500;
  color:var(--ink3);font-size:10.5px;letter-spacing:.05em;padding:8px 9px 7px;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 26%,transparent);
  box-shadow:0 1px 0 var(--card);white-space:nowrap;user-select:none;cursor:pointer}
table.dt th.nosort{cursor:default}
table.dt th:hover:not(.nosort){color:var(--ink)}
table.dt th .ar{font-size:8px;opacity:.6;margin-left:3px}
/* 表头里的单位：跟表头同一行、更小更淡，不要用 .sm（那是 block，会把表头撑成两行） */
table.dt th .thu{font-size:9.5px;font-weight:400;opacity:.8;margin-left:4px;letter-spacing:0}
table.dt td{padding:8px 9px;border-bottom:1px solid var(--rule2);vertical-align:top;
  font-variant-numeric:tabular-nums}
table.dt tr:last-child td{border-bottom:0}
tr.xrow{cursor:pointer}
tr.xrow td{transition:background .12s}
tr.xrow:hover td,tr.xrow.open td,tr.xrow[aria-expanded="true"] td{background:var(--card2)}
tr.xbody>td{background:var(--card2);padding:0 0 2px;box-shadow:inset 2px 0 0 var(--accent)}
tr.xrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.dt.sub{font-size:12px;min-width:0}
table.dt.sub th{position:static;background:transparent;font-size:10.5px;
  color:var(--ink3);padding:7px 9px 5px;border-bottom:1px solid var(--rule)}
table.dt.sub td{padding:6px 9px;border-bottom:1px solid var(--rule2)}
table.dt tbody tr:hover td{background:var(--card2)}
table.dt .r{text-align:right;white-space:nowrap}
table.dt .mut{color:var(--ink3)}
table.dt .nm{font-weight:500;white-space:nowrap;color:var(--ink)}
table.dt .sm{font-size:11px;color:var(--ink3);display:block;line-height:1.5;margin-top:1px}
table.dt .wide{min-width:100px;max-width:280px}

/* 状态：点 + 文字，比彩色胶囊安静得多 */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;line-height:1.4}
.st i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.s-confirmed{color:var(--ok)} .s-single_source{color:var(--warn)} .s-stale{color:var(--warn)}
.s-conflict{color:var(--bad)} .s-unverified{color:var(--ink3)}
.s-incomparable{color:var(--vio)} .s-uncovered{color:var(--ink3)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--card2);
  color:var(--ink3);margin-left:5px;letter-spacing:.02em;vertical-align:1px;
  border:1px solid var(--rule2)}
.tag.warn{color:var(--warn);background:transparent;border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
.tag.bad{color:var(--bad);background:transparent;border-color:color-mix(in srgb,var(--bad) 34%,transparent)}
.tag.ok{color:var(--ok);background:transparent;border-color:color-mix(in srgb,var(--ok) 34%,transparent)}

.empty{padding:18px 4px;color:var(--ink3);font-size:12.5px;line-height:1.7}
ul.tips{margin:0;padding-left:0;list-style:none;font-size:12.5px;line-height:1.75;color:var(--ink2)}
ul.tips li{position:relative;padding:8px 0 8px 15px;border-bottom:1px solid var(--rule2)}
ul.tips li:last-child{border-bottom:0}
ul.tips li::before{content:"";position:absolute;left:0;top:16px;width:5px;height:5px;
  border-radius:50%;background:var(--ink3);opacity:.45}
ul.tips li.warn::before{background:var(--bad);opacity:.85}
ul.tips b{color:var(--ink);font-weight:600}
ul.tips code,.foot code{background:var(--card2);border:1px solid var(--rule2);padding:1px 5px;
  border-radius:4px;font-size:11px;font-family:var(--mono)}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.75}

/* 报告弹层 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,19,22,.42);display:none;
  padding:48px 20px;backdrop-filter:blur(3px)}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.modal .box{background:var(--card);border:var(--hair);border-radius:var(--r2);
  box-shadow:0 30px 70px -24px rgba(0,0,0,.45);width:min(860px,100%);max-height:78vh;
  display:flex;flex-direction:column;overflow:hidden}
.modal .bh{display:flex;align-items:center;gap:10px;padding:15px 20px;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 16%,transparent)}
.modal .bh b{font-family:var(--serif);font-size:15px;font-weight:600}
.modal pre{margin:0;padding:18px 20px;overflow:auto;font-family:var(--mono);font-size:12px;
  line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.md{padding:16px 22px 24px;overflow:auto;font-size:12.5px;line-height:1.8;color:var(--ink2);
  white-space:normal;font-family:var(--font)}
.md h1{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin:4px 0 12px}
.md h2{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--ink);margin:20px 0 8px;
  padding-top:13px;border-top:var(--hair)}
.md h3{font-size:12.5px;color:var(--ink);margin:13px 0 5px;font-weight:600}
.md p{margin:7px 0}
.md ul{margin:7px 0;padding-left:18px}
.md li{margin:3px 0}
.md blockquote{margin:10px 0;padding:9px 12px;border-left:2px solid var(--rule);
  background:var(--card2);border-radius:0 5px 5px 0}
.md code{background:var(--card2);border:1px solid var(--rule2);padding:0 4px;border-radius:4px;
  font-family:var(--mono);font-size:11px;color:var(--ink)}
.md table{width:100%;border-collapse:collapse;margin:10px 0;font-size:11.5px}
.md th,.md td{padding:6px 8px;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
.md th{color:var(--ink3);font-weight:500;white-space:nowrap;font-size:10.5px}
.skel{height:90px;border-radius:10px;border:var(--hair);
  background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:sk 1.2s infinite}
.skel.short{height:54px}
@keyframes sk{to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ---------- 同模型 · 跨渠道价差（对数价格带） ----------
   一行一个模型，轨道上是各家渠道的报价：位置 = 价格（log10），
   点色 = 渠道类型，绿圈 = 这一行最便宜，×n = 有几家同价。
   价格跨两个数量级，线性轴会把便宜的那几家全挤成左边一坨，所以必须取对数。 */
.cm{--cm-w:176px;--cm-min:100px;--cm-sp:48px}
.cm-axis,.cm-row{display:grid;
  grid-template-columns:var(--cm-w) minmax(0,1fr) var(--cm-min) var(--cm-sp);
  align-items:center;gap:10px}
.cm-axis{padding:0 6px 5px;font-size:9.5px;letter-spacing:.05em;color:var(--ink3)}
.cm-axis .h{text-align:right}
.cm-scale{position:relative;height:14px;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.cm-scale span{position:absolute;bottom:3px;transform:translateX(-50%);white-space:nowrap}
.cm-row{width:100%;padding:5px 6px;border-radius:8px;text-align:left;cursor:pointer;
  transition:background .12s var(--ease)}
.cm-row:hover,.cm-row.open{background:var(--card2)}
.cm-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cm-nm{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cm-nm .sm{display:block;font-size:10.5px;font-weight:400;color:var(--ink3);
  line-height:1.3;margin:0}
.cm-track{position:relative;height:16px;min-width:0}
.cm-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:var(--rule2)}
.cm-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--rule2)}
.cm-pt{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card);cursor:default}
.cm-pt.k-official{background:var(--accent)}
.cm-pt.k-cloud{background:var(--vio)}
.cm-pt.k-aggregator{background:var(--ink3)}
/* 谷时价是另一个商品，不是折扣：空心虚线点，一眼跟标准价分开 */
.cm-pt.t-offpeak{background:transparent;border:1.5px dashed var(--ink2);
  width:6px;height:6px}
.cm-pt.low{width:9px;height:9px;
  box-shadow:0 0 0 2px var(--card),0 0 0 3px color-mix(in srgb,var(--ok) 55%,transparent)}
.cm-n{position:absolute;top:50%;transform:translate(5px,-50%);font-size:9px;
  color:var(--ink3);line-height:1;pointer-events:none}
.cm-min{text-align:right;font-size:12px;font-weight:600;color:var(--ink);
  white-space:nowrap}
.cm-min .sm{display:block;font-size:9.5px;font-weight:400;color:var(--ink3);
  margin:0 0 0 auto;max-width:100px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.cm-sp{text-align:right;font-size:12px;color:var(--ink3);white-space:nowrap}
.cm-sp.wide{color:var(--bad);font-weight:600}

.cm-det .c{display:inline-flex;align-items:center;gap:5px;font-size:11px;

.cm-det .c i.k-cloud{background:var(--vio)}
.cm-det .c i.k-aggregator{background:var(--ink3)}

.cm-legend span{display:inline-flex;align-items:center;gap:5px}
.cm-legend i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

.cm-subs .c{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;color:var(--ink2);
  background:var(--card);border:var(--hair);border-radius:6px;padding:3px 8px;white-space:nowrap}
.cm-subs .c b{font-weight:600;color:var(--ink)}
.cm-subs .c.mut{color:var(--ink3)}

@media (max-width:560px){

  .cm-axis{display:none}

<script>
/* ============================================================
   Token 价格追踪 · 纯原生 JS，数据来自 /api/data
   一卡一问：每张卡自己渲染，互不依赖（某张算不出来不拖垮整页）
   ============================================================ */
var S = null;                  // 服务端 payload
var FLT = {status:new Set(), q:'', esrc:''};   // API 状态筛选 / 关键词 / 事件来源
var SORT = {};                 // 每张表的排序状态：{key, dir}
var TB = {};                   // 表格注册表（表 id → 规格），供表头点击用

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function num(v, d){ return (v === null || v === undefined || v === '' || isNaN(v)) ? (d === undefined ? null : d) : Number(v); }
function money(v, n){ var x = num(v); return x === null ? '—' : (n === 0 ? Math.round(x) : x.toFixed(n === undefined ? 2 : n)); }
function int(v){ var x = num(v); return x === null ? '—' : Math.round(x).toLocaleString('en-US'); }
function mult(v){ if(!v) return '—'; if(v >= 1e8) return (v/1e8).toFixed(1)+' 亿'; if(v >= 1e4) return Math.round(v/1e4)+' 万'; return String(Math.round(v)); }
function pct(v){ return num(v) === null ? '—' : Math.round(v*100) + '%'; }
var PK = {standard:'标准价', offpeak:'峰谷价', 'offpeak+promo':'峰谷+促销', promo:'促销价',
          cache:'含缓存', peak:'峰时价'};
var SRCT = {official:'官方', community_measured:'社区实测', community_estimate:'社区估算',
            'official+community':'官方+社区', measured:'实测', estimate:'估算', doc:'文档'};
function cn(map, v){ return map[v] || v; }

/* ---------- 主题 ---------- */
function isDark(){ return document.documentElement.dataset.theme === 'dark'; }
function chartSvg(name){
  var c = (S && S.charts) || {};
  return (isDark() ? (c[name+'_dark'] || c[name]) : c[name]) || '';
}
$('btnTheme').onclick = function(){
  var next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('lc_theme', next); }catch(e){}
  render();                                  // 图是 SVG，得按主题换一套配色
};

/* ---------- 取数 ---------- */
function load(force){
  $('btnRefresh').disabled = true;
  $('btnRefresh').setAttribute('aria-busy', 'true');
  if (force) $('sub').textContent = '重新核验中…';
  fetch('/api/data' + (force ? '?force=1' : ''), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(p){
      if (!p.ok) throw new Error(p.error || '算不出来');
      S = p; render(); summary();
    })
    .catch(function(e){
      $('b-verdict').innerHTML = '<div class="empty">读不到数据：' + esc(e.message || e)
        + '<br>服务是仓库里的 <code>llmcost.py</code>，数据目录见 <code>$LLMCOST_DIR</code>（默认 <code>~/.pocket-llmcost</code>）。</div>';
    })
    .then(function(){ $('btnRefresh').disabled = false;
      $('btnRefresh').removeAttribute('aria-busy'); });
}
$('btnRefresh').onclick = function(){ load(true); };

function summary(){
  var m = S.meta, c = S.counts;
  $('sub').innerHTML = '核验 <b>' + int(m.obs) + '</b> 条观测 · <b>' + m.n_sources + '</b> 个来源'
    + '<span class="dot"></span>' + c.confirmed + ' 一致 / ' + c.conflict + ' 冲突 / '
    + (c.single_source + c.uncovered) + ' 待补'
    + '<span class="dot"></span>数据日 ' + esc(m.date) + ' · USD→CNY ' + m.fx;
}

/* ---------- 通用：图 ---------- */
function chart(name, hint, label){
  return (hint ? '<p class="hint">' + hint + '</p>' : '')
    + '<div class="chart-hint">← 左右滑动看完整图 →</div>'
    + '<div class="chart" data-chart="' + name + '" tabindex="0" role="group" aria-label="'
    + esc(label || name) + '">' + chartSvg(name) + '</div>';
}

/* ---------- 通用表格 ----------
   spec = {id, cols:[{k,label,cls,fmt,sort}], rows, empty}
   点表头排序、点同一列反向 —— 排序状态存在 SORT[id] 里，重新渲染不丢 */
function table(spec){
  TB[spec.id] = spec;
  var st = SORT[spec.id] || null;
  var rows = spec.rows.slice();
  if (st && st.k){
    var col = spec.cols.filter(function(c){ return c.k === st.k; })[0] || {};
    rows.sort(function(a, b){
      var x = a[st.k], y = b[st.k];
      if (col.num){ x = num(x, -Infinity); y = num(y, -Infinity); }
      else { x = String(x == null ? '' : x); y = String(y == null ? '' : y); }
      if (x < y) return st.dir === 'asc' ? -1 : 1;
      if (x > y) return st.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  if (!rows.length) return '<div class="empty">' + esc(spec.empty || '没有符合条件的行') + '</div>';
  var head = spec.cols.map(function(c){
    var arrow = st && st.k === c.k ? '<span class="ar">' + (st.dir === 'asc' ? '▲' : '▼') + '</span>' : '';
    return '<th class="' + (c.cls || '') + (c.sort === false ? ' nosort' : '')
      + '" data-t="' + spec.id + '" data-k="' + c.k + '">' + c.label + arrow + '</th>';
  }).join('');
  var body = rows.map(function(r){
    return '<tr>' + spec.cols.map(function(c){
      var v = c.fmt ? c.fmt(r[c.k], r) : (r[c.k] == null ? '—' : r[c.k]);
      return '<td class="' + (c.cls || '') + '">' + v + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="tscroll"><table class="dt"><thead><tr>' + head + '</tr></thead>'
    + '<tbody>' + body + '</tbody></table></div>'
    + (spec.foot ? '<div class="foot mt">' + spec.foot + '</div>' : '');
}

/* 表头点击：全局委托，避免每次渲染重绑 */
document.addEventListener('click', function(e){
  var th = e.target.closest && e.target.closest('th[data-k]');
  if (!th) return;
  var id = th.getAttribute('data-t'), k = th.getAttribute('data-k');
  var spec = TB[id]; if (!spec) return;
  var col = spec.cols.filter(function(c){ return c.k === k; })[0];
  if (col && col.sort === false) return;
  var st = SORT[id];
  SORT[id] = (st && st.k === k)
    ? {k:k, dir: st.dir === 'asc' ? 'desc' : 'asc'}
    : {k:k, dir: (col && col.num) ? 'desc' : 'asc'};
  render();
});

/* ---------- 状态胶囊 ---------- */
function pill(status){
  var nm = (S.status_cn || {})[status] || status;
  return '<span class="pill s-' + status + '"><i></i>' + esc(nm) + '</span>';
}
function statusOf(r){ return pill(r.status); }
function arrowTag(d){
  if (Math.abs(d) < 1e-9) return '<span class="sm" style="display:inline">持平</span>';
  var up = d > 0;
  return '<span class="tag ' + (up ? 'bad' : 'ok') + '">' + (up ? '↑ 涨 ' : '↓ 跌 ')
    + Math.abs(d * 100).toFixed(0) + '%</span>';
}

var VIEW = {};

/* ① 本轮结论 */
VIEW.verdict = function(){
  var m = S.meta, c = S.counts, p = S.pick || {};
  var ch = p.cheapest_std || p.cheapest;
  var std = S.api.filter(function(r){ return r.output_cny && (r.price_kind || 'standard') === 'standard'; });
  var hi = std.slice().sort(function(a, b){ return b.output_cny - a.output_cny; })[0];
  var ratio = (ch && hi && ch.cny) ? Math.round(hi.output_cny / ch.cny) : 0;
  var claim = ch
    ? '最便宜的标准档是 <b>' + esc(ch.display) + '</b>；最贵的 <b>' + esc(hi ? hi.display : '—')
      + '</b> 每百万输出要 <b>' + money(hi ? hi.output_cny : null) + ' 元</b>，是它的 <b>' + ratio + ' 倍</b>。'
      + '同一个「输出 token」口径，价差到这个量级 —— 先定选型，再谈提示词优化。'
      + ((ch && ch.status && ch.status !== 'confirmed')
          // 标签另起一行：原先夹在句子中间，窄屏会在标签和「，」之间断行，逗号跑到行首
          ? '<br><span class="tag warn">'
            + esc((S.status_cn || {})[ch.status] || ch.status) + '</span>'
            + ' 这条最低价只有一个来源对上，等第二个来源再当定论。'
          : '')
    : '本轮没有可用的 API 记录。';
  var bp = p.best_plan, expired = bp && bp.promo && bp.promo < m.date;
  var CV = {confirmed:'--ok', single_source:'--warn', stale:'--warn', conflict:'--bad',
            incomparable:'--vio', unverified:'--ink3', uncovered:'--ink3'};
  var tot = Math.max(1, S.api.length);
  var segs = S.status_order.filter(function(s){ return c[s]; }).map(function(s){
    return '<i style="width:' + (c[s] / tot * 100) + '%;background:var(' + (CV[s] || '--ink3') + ')"></i>';
  }).join('');
  return {
    meta: '数据日 ' + esc(String(m.date).slice(5)) + ' · ' + (m.ms || 0) + ' ms',
    body: '<div class="big">' + (ch ? money(ch.cny) : '—') + '<small>元 / 百万输出 token</small></div>'
      + '<div class="claim">' + claim + '</div>'
      + '<div class="facts">'
        + '<div><div class="side-k">套餐最快回本</div>'
          + '<div class="side-v">' + (bp ? mult(bp.break_even) + '<small>百万 / 月</small>' : '—') + '</div>'
          + '<div class="side-f">' + (bp ? esc(bp.platform + ' · ' + bp.plan) + '，月费 ¥' + money(bp.monthly, 1)
              : '本轮没有可折算套餐')
            + (expired ? ' · <span style="color:var(--bad)">活动已到期</span>'
                       : (bp && bp.promo ? ' · 限时到 ' + esc(bp.promo) : '')) + '</div></div>'
        + '<div><div class="side-k">数据可核验度</div>'
          + '<div class="side-v">' + c.confirmed + '<small>/ ' + S.api.length + ' 多源一致</small></div>'
          + '<div class="sbar">' + segs + '</div>'
          + '<div class="side-f">' + c.conflict + ' 条冲突 · ' + c.single_source + ' 条单源 · '
            + c.incomparable + ' 条口径不可比 · 观测 ' + int(m.obs) + ' 条</div></div>'
      + '</div>'
      + (function(){
          var lb = S.leaderboard || {}, bv = (lb.summary || {}).best_value;
          if (!bv) return '';
          return '<div class="pick">按单位成本选：<b>' + esc(bv.display) + '</b> '
            + money(bv.price, 2) + ' 元 / 百万输出，LMArena 综合 <b>' + Math.round(bv.score)
            + ' 分</b>（第 ' + bv.rank + ' 名）—— 往上加钱能买到的分，见「价格 × 实力」卡。</div>';
        })()
  };
};

/* ④ 模型天梯榜：LMArena（HF）+ 幻觉率（GitHub），落到我们跟踪的 15 个模型上 */
VIEW.ladder = function(){
  var lb = S.leaderboard || {};
  if (!lb.ready){
    return {meta:'', body:'<div class="empty">还没有榜单数据：跑一次 <code>python3 llmcost_leaderboard.py</code>，'
      + '从 HuggingFace 的 LMArena 数据集与 GitHub 的幻觉率榜抓一份。</div>'};
  }
  var rows = (lb.rows || []).slice().sort(function(a, b){
    if (a.score && b.score) return b.score - a.score;
    return (a.score ? -1 : 1) - (b.score ? -1 : 1) || a.price - b.price;
  });
  var dim = function(r, k){
    var d = (r.dims || {})[k];
    if (!d) return '<span class="mut">—</span>';
    if (d.unit === 'winrate') return '<span class="mut">#' + d.rank + '</span>';
    return '<b>' + Math.round(d.score) + '</b><span class="sm">#' + d.rank + '</span>';
  };
  var t = table({
    id:'ladder', rows:rows, empty:'',
    cols:[
      {k:'display', label:'模型', fmt:function(v, r){
          return '<span class="nm">' + esc(v) + '</span><span class="sm">'
            + esc(r.arena || '未上榜：' + (r.match === 'cjk' ? '中文名与外文榜对不上' : '榜上没有这个型号'))
            + (r.tier ? ' · ' + esc(r.tier) : '') + '</span>';
        }},
      {k:'rank', label:'综合', cls:'r', num:true, fmt:function(v, r){
          return r.score ? '<b>' + Math.round(r.score) + '</b><span class="sm">#' + (r.rank || '—') + '</span>'
            : '<span class="mut">未上榜</span>';
        }},
      /* 价格紧跟分数：这张卡要回答的就是「这个分要多少钱」，
         手机上一屏只露得下三四列，价格必须排在前面，不能被挤出屏幕。
         单位写在表头一次，行里只留数字，15 行重复「元 / 百万」是噪音 */
      {k:'price', label:'输出价<span class="thu">元 / 百万</span>', cls:'r', num:true, fmt:function(v){
          return money(v, 2);
        }},
      {k:'coding', label:'代码', cls:'r', sort:false, fmt:function(v, r){ return dim(r, 'coding'); }},
      {k:'chinese', label:'中文', cls:'r', sort:false, fmt:function(v, r){ return dim(r, 'chinese'); }},
      {k:'vision', label:'视觉', cls:'r', sort:false, fmt:function(v, r){ return dim(r, 'vision'); }},
      {k:'webdev', label:'前端', cls:'r', sort:false, fmt:function(v, r){ return dim(r, 'webdev'); }},
      {k:'halluc', label:'幻觉率', cls:'r', num:true, fmt:function(v, r){
          return r.halluc ? '<b>' + r.halluc.rate.toFixed(1) + '%</b>'
            + '<span class="sm">引用 ' + Math.round(r.halluc.citation) + '%</span>'
            : '<span class="mut">—</span>';
        }},
      {k:'pareto', label:'前沿', sort:false, fmt:function(v, r){
          return r.pareto ? '<span class="tag ok">在</span>'
            : (r.dominated_by ? '<span class="sm" style="display:inline">被 ' + esc(r.dominated_by) + ' 支配</span>' : '');
        }}
    ],
    foot:'榜：<b>' + esc(lb.meta.hf_dataset) + '</b>（快照 ' + esc(String(lb.meta.date).slice(0, 10))
      + '，' + (lb.meta.n_models || 0) + ' 个型号在综合榜）。幻觉率：<b>' + esc(lb.meta.gh_repo)
      + '</b>，只覆盖到 ' + (lb.meta.n_halluc || 0) + ' 个型号，我们这 15 个里只有少数有数。'
  });
  var s = lb.summary || {}, top = (lb.top || []).slice(0, 3);
  return {
    meta: (s.n_matched || 0) + ' / ' + (s.n_total || 0) + ' 个在榜',
    body: (top.length ? '<p class="hint">综合榜天花板：' + top.map(function(x){
        return '<b>' + esc(x.model) + '</b> ' + Math.round(x.score);
      }).join(' · ') + '。下面是<b>我们跟踪的 ' + (s.n_total || 0) + ' 个</b>各自的位置 —— '
      + '同一模型的 High / Max 档取分最高者。</p>' : '')
      + t
  };
};

/* ⑤ 价格 × 实力：散点 + 前沿一句话 */
VIEW.value = function(){
  var lb = S.leaderboard || {};
  if (!lb.ready || !(lb.summary || {}).frontier){
    return {meta:'', body:'<div class="empty">还没有榜单数据，先跑 <code>python3 llmcost_leaderboard.py</code>。</div>'};
  }
  var s = lb.summary, f = s.frontier || [];
  var line;
  if (f.length){
    var steps = [];
    for (var i = 1; i < f.length; i++){
      steps.push('加 <b>' + money(f[i].price - f[i - 1].price, 0) + ' 元</b>换 <b>'
        + (f[i].score - f[i - 1].score).toFixed(1) + ' 分</b>');
    }
    line = '前沿只有 <b>' + f.length + ' 个</b>：' + f.map(function(x){
        return esc(x.display) + '（' + money(x.price, 2) + ' 元 / ' + Math.round(x.score) + ' 分）';
      }).join(' → ')
      + (steps.length ? '；沿它往上走，' + steps.join('、') : '') + '。';
  } else {
    line = '没有可比的价格 / 分数配对。';
  }
  var worst = s.priciest && s.priciest.dominated_by
    ? '<br>最贵的 <b>' + esc(s.priciest.display) + '</b> 花 ' + money(s.priciest.price, 0)
      + ' 元，分反而被 <b>' + esc(s.priciest.dominated_by) + '</b> 压着。' : '';
  return {
    meta: (s.n_matched || 0) + ' 个可比 · ' + (s.n_dominated || 0) + ' 个被支配',
    body: '<p class="hint">' + line + worst + '</p>'
      + chart('ladder', '', '价格与实力的散点图')
  };
};

    id:'histchg', rows:h.changes || [], empty:'这段时间没有模型调价',

      {k:'date', label:'生效日', fmt:function(v){ return '<span class="nm">' + esc(v) + '</span>'; }},
      {k:'display', label:'模型', fmt:function(v, r){
          return esc(v) + '<span class="sm">' + esc(r.model) + '</span>'; }},
      {k:'from', label:'原价 → 现价', cls:'r', num:true, fmt:function(v, r){
          return '<span style="white-space:nowrap">' + money(r.from, 2) + ' → <b>' + money(r.to, 2)
            + '</b> <span class="sm" style="display:inline">' + esc(r.currency) + '</span></span>'; }},
      {k:'pct', label:'幅度', cls:'r', num:true, fmt:function(v){
          return '<span style="white-space:nowrap">' + arrowTag(v) + '</span>'; }},
      {k:'basis', label:'依据', sort:false, fmt:function(v){
          var B = {official:'官方现价', event:'按事件回溯', carry:'现值回溯', snapshot:'自动快照'};
          return '<span class="tag ' + (v === 'official' ? 'ok' : (v === 'event' ? 'warn' : '')) + '">'
            + esc(B[v] || v) + '</span>'; }}
    ],
    foot:'只有这几种记录才算「追踪」的产出：一条带生效日与依据的调价，比一张当下价目表有用。'
  });

};

/* ⑨ 月度价格矩阵 */
VIEW.matrix = function(){
  var h = S.history || {}, dates = h.dates || [], models = h.models || [];
  if (!models.length) return {meta:'', body:'<div class="empty">还没有价格史。</div>'};
  var cols = [
    {k:'display', label:'模型', fmt:function(v, r){
        return '<span class="nm">' + esc(v) + '</span><span class="sm">' + esc(r.currency) + '</span>'; }}
  ];
  dates.forEach(function(d, i){
    cols.push({k:'d' + i, label:d.slice(5), cls:'r', num:true, fmt:function(v, row){
      var s = row.series, cur = null, prev = null;
      for (var k = 0; k < s.length; k++){
        if (s[k][0] === d) cur = s[k][1];
        else if (s[k][0] < d) prev = s[k][1];
      }
      if (cur === null) return '<span class="mut">—</span>';
      var moved = (prev !== null && Math.abs(cur - prev) > 1e-9);
      var col = moved ? (cur > prev ? 'var(--bad)' : 'var(--ok)') : '';
      return '<span style="' + (moved ? 'color:' + col + ';font-weight:600' : '') + '">'
        + money(cur, 2) + (moved ? (cur > prev ? ' ▲' : ' ▼') : '') + '</span>';
    }});
  });
  cols.push({k:'chg', label:'期间', cls:'r', num:true, fmt:function(v, r){
    return '<span style="white-space:nowrap">' + arrowTag(r.chg) + '</span>'; }});
  return {
    meta: models.length + ' 行 × ' + dates.length + ' 期',
    body: table({id:'histmx', rows:models, cols:cols,
      foot:'值 = 输出价折人民币 / 百万 token（USD 按 1 美元 ' + (h.fx || '—')
        + ' 元换算）；红色涨、绿色跌（A 股口径），没变的不上色。'})
  };
};

        }},

      {k:'cache_cny', label:'缓存命中', cls:'r', num:true, fmt:function(v){ return v == null ? '—' : money(v); }},

/* ⑫ 模型 × 平台报价 */
VIEW.panotable = function(){
  var p = S.panorama || {}, models = p.models || [], lines = p.lines || [];
  if (!lines.length) return {meta:'', body:'<div class="empty">价格库还是空的。</div>'};
  var KM = {official:'官方', cloud:'云厂商', aggregator:'第三方'};
  var badge = function(k){
    var cls = k === 'official' ? 'ok' : (k === 'cloud' ? 'warn' : '');
    return '<span class="tag ' + cls + '">' + (KM[k] || k) + '</span>';
  };
  var byModel = {};
  lines.forEach(function(l){ (byModel[l.model] = byModel[l.model] || []).push(l); });
  var rows = models.map(function(m, i){
    var ls = (byModel[m.model] || []).slice().sort(function(a, b){ return a.last - b.last; });
    var xid = 'px' + i;
    var sp = (m.spread == null) ? '<span class="mut">单平台</span>'
      : (m.spread <= 1.03 ? '<span class="mut">基本持平</span>'
         : '<b style="color:var(--bad)">' + m.spread.toFixed(1) + '×</b>');
    var official = m.official != null ? money(m.official, 2)
      + (m.official_low != null && m.official_low !== m.official
          ? '<span class="sm">低谷 ' + money(m.official_low, 2) + '</span>' : '')
      : '<span class="mut">—</span>';
    var minNote = (m.min_kind === 'cloud' && m.official && m.min < m.official * 0.97)
      ? '<span class="sm" style="color:var(--warn)">可能未跟进调价</span>' : '';
    var main = '<tr class="xrow" data-x="' + xid + '" tabindex="0" role="button"'
      + ' aria-expanded="false" aria-controls="' + xid + '"'
      + ' aria-label="展开 ' + esc(m.display) + ' 在各平台的报价">'
      + '<td><span class="nm">' + esc(m.display) + '</span><span class="sm">'
        + esc(m.model) + '</span></td>'
      + '<td class="r">' + official + '</td>'
      + '<td class="r">' + money(m.min, 2) + '<span class="sm">' + esc(m.min_name) + '</span>' + minNote + '</td>'
      + '<td class="r">' + money(m.max, 2) + '<span class="sm">' + esc(m.max_name) + '</span></td>'
      + '<td class="r">' + sp + '</td>'
      + '<td class="r">' + m.n_platforms + '</td></tr>';
    var detail = '<tr class="xbody" id="' + xid + '" style="display:none"><td colspan="6">'
      + '<table class="dt sub"><thead><tr><th>平台</th><th>类型</th><th class="r">当前价</th>'
      + '<th class="r">相对官方</th><th class="r">观测</th></tr></thead><tbody>'
      + ls.map(function(l){
          var ratio = (m.official && l.last && l.kind !== 'official') ? l.last / m.official : null;
          var rc = ratio == null ? '<span class="mut">基准</span>'
            : (ratio > 1.001 ? '<span style="color:var(--bad)">+' + ((ratio - 1) * 100).toFixed(0) + '%</span>'
              : (ratio < 0.999 ? '<span style="color:var(--ok)">' + ((ratio - 1) * 100).toFixed(0) + '%</span>'
                : '<span class="mut">同价</span>'));
          return '<tr><td>' + esc(l.platform_name) + '</td><td>' + badge(l.kind) + '</td>'
            + '<td class="r">' + money(l.last, 2) + '</td><td class="r">' + rc + '</td>'
            + '<td class="r">' + l.series.length + ' 点</td></tr>';
        }).join('')
      + '</tbody></table></td></tr>';
    return main + detail;
  }).join('');
  return {
    meta: models.length + ' 个模型',
    body: '<div class="tscroll"><table class="dt"><thead><tr>'
      + '<th>模型</th><th class="r">官方价</th><th class="r">最便宜</th><th class="r">最贵</th>'
      + '<th class="r">价差</th><th class="r">平台</th></tr></thead><tbody>' + rows
      + '</tbody></table></div>'
      + '<div class="foot mt">价差只比<b>第三方之间</b>；官方低谷价是另一个商品口径，混进来会把口径差算成渠道差。</div>'
  };
};

/* ⑫b 同模型 · 跨渠道价差
   不按平台排、也不按模型列表排，而是把「同一个模型在几家买」摊成一条价格带：
   点越散 = 换渠道越值得比价。数字只给最低价与价差，逐家明细点开看。 */
VIEW.chanmap = function(){
  var p = S.panorama || {}, models = p.models || [], lines = p.lines || [];
  if (!lines.length) return {meta:'', body:'<div class="empty">价格库还是空的。</div>'};
  var KM = {official:'厂商自营', cloud:'云厂商', aggregator:'第三方'};
  var lg = function(v){ return Math.log(v) / Math.LN10; };
  var vals = lines.map(function(l){ return +l.last; }).filter(function(v){ return v > 0; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  /* 轴端点取 1/2/5×10ⁿ 的整档：刻度落在整数上，点不会贴着边框 */
  var nice = function(v, up){
    var e = Math.floor(lg(v)), m = v / Math.pow(10, e), n;
    if (up) n = m <= 1 ? 1 : (m <= 2 ? 2 : (m <= 5 ? 5 : 10));
    else n = m >= 5 ? 5 : (m >= 2 ? 2 : 1);
    return n * Math.pow(10, e);
  };
  var d0 = nice(lo, false), d1 = nice(hi, true), span = lg(d1) - lg(d0);
  var px = function(v){ return (lg(v) - lg(d0)) / span * 100; };
  var ticks = [];
  for (var e = Math.round(lg(d0)); e <= Math.round(lg(d1)); e++){
    [1, 2, 5].forEach(function(k){
      var v = k * Math.pow(10, e);
      if (v > d0 * 0.999 && v < d1 * 0.999) ticks.push(v);
    });
  }
  var grids = ticks.map(function(v){
    return '<i class="cm-gl" style="left:' + px(v).toFixed(2) + '%"></i>';
  }).join('');

  var byModel = {};
  lines.forEach(function(l){ (byModel[l.model] = byModel[l.model] || []).push(l); });
  var rows = models.slice().sort(function(a, b){
    var x = a.spread || 0, y = b.spread || 0;
    if (Math.abs(y - x) > 1e-9) return y - x;
    return (b.n_platforms || 0) - (a.n_platforms || 0);
  });

  var body = rows.map(function(m, i){
    var ls = (byModel[m.model] || []).slice().sort(function(a, b){ return a.last - b.last; });
    /* 同价的渠道合并成一个点：一格里七八家都卖 8.64，画七个点只会糊成一条 */
    var cl = {}, order = [];
    ls.forEach(function(l){
      var k = (+l.last).toFixed(3);
      if (!cl[k]){ cl[k] = {v: +l.last, ls: []}; order.push(k); }
      cl[k].ls.push(l);
    });
    var cs = order.map(function(k){ return cl[k]; });
    var lowv = cs.length ? cs[0].v : 0;
    var dots = cs.map(function(c){
      var kinds = {};
      c.ls.forEach(function(l){ kinds[l.kind] = 1; });
      var kind = kinds.official ? 'official' : (kinds.cloud ? 'cloud' : 'aggregator');
      var offpeak = c.ls.some(function(l){ return l.tier && l.tier !== 'standard'; });
      var cls = 'cm-pt k-' + kind + (offpeak ? ' t-offpeak' : '')
        + (cs.length > 1 && c.v === lowv ? ' low' : '');
      var tip = c.ls.map(function(l){
        return l.platform_name + ' ¥' + money(l.last, 2) + '（' + (KM[l.kind] || l.kind)
          + (l.tier && l.tier !== 'standard' ? ' · 谷时价' : '') + '）';
      }).join('\n');
      var pos = px(c.v).toFixed(2);
      return '<i class="' + cls + '" style="left:' + pos + '%" title="' + esc(tip) + '"></i>'
        + (c.ls.length > 1 ? '<span class="cm-n" style="left:' + pos + '%">×'
            + c.ls.length + '</span>' : '');
    }).join('');
    var nn = cs.length ? cs[0].ls.map(function(l){ return l.platform_name; }) : [];
    var minName = nn.length
      ? nn[0] + (nn.length > 1 ? ' 等 ' + nn.length + ' 家' : '') : '—';
    /* 最低价落在谷时价上要标出来：那是另一个商品，别让人以为白天也能买到 */
    if (cs.length && cs[0].ls.every(function(l){ return l.tier && l.tier !== 'standard'; })){
      minName += ' · 谷时';
    }
    var sp = m.spread;
    var spTxt = sp == null ? (ls.length > 1 ? '—' : '单家')
      : (sp <= 1.02 ? '持平' : sp.toFixed(1) + '×');
    var xid = 'cm' + i;
    var det = ls.map(function(l){
      /* 只跟标准价的官方价比：官方低谷价是另一个商品，拿来当基准会把口径差算成渠道差 */
      var rel = (m.official && m.official_tier === 'standard'
        && l.kind !== 'official' && (!l.tier || l.tier === 'standard'))
        ? l.last / m.official : null;
      var d = (rel == null || Math.abs(rel - 1) <= 0.005) ? ''
        : '<span style="color:var(--' + (rel > 1 ? 'bad' : 'ok') + ')">'
          + (rel > 1 ? '+' : '') + Math.round((rel - 1) * 100) + '%</span>';
      return '<span class="c' + (cs.length > 1 && l.last === lowv ? ' low' : '') + '">'
        + '<i class="k-' + l.kind + '"></i>' + esc(l.platform_name)
        + ' <b>¥' + money(l.last, 2) + '</b>' + (d ? ' ' + d : '')
        + (l.tier && l.tier !== 'standard'
            ? '<span class="tag warn" style="margin-left:1px">谷时</span>' : '')
        + '</span>';
    }).join('');
    return '<div class="cm-row" data-x="' + xid + '" tabindex="0" role="button"'
      + ' aria-expanded="false" aria-controls="' + xid + '">'
      + '<div class="cm-nm">' + esc(m.display) + '<span class="sm">' + esc(m.model)
        + (ls.length > 1 ? ' · ' + ls.length + ' 家' : ' · 仅 1 家') + '</span></div>'
      + '<div class="cm-track">' + grids + dots + '</div>'
      + '<div class="cm-min">¥' + money(lowv, 2) + '<span class="sm">' + esc(minName) + '</span></div>'
      + '<div class="cm-sp' + (sp >= 2 ? ' wide' : '') + '">' + spTxt + '</div>'
      + '</div>'
      + '<div class="cm-det" id="' + xid + '" style="display:none"><div class="set">' + det + '</div></div>';
  }).join('');

  var axis = '<div class="cm-axis"><div>模型</div><div class="cm-scale">'
    + ticks.map(function(v){
        return '<span style="left:' + px(v).toFixed(2) + '%">¥' + (v >= 1 ? Math.round(v) : v) + '</span>';
      }).join('')
    + '</div><div class="h">最低价<span style="font-size:9px;opacity:.8"> 元/百万</span></div>'
    + '<div class="h sp">价差</div></div>';

  var legend = '<div class="cm-legend">'
    + '<span><i class="o"></i>厂商自营</span><span><i class="c"></i>云厂商</span>'
    + '<span><i class="a"></i>第三方</span><span><i class="low"></i>这一行最便宜</span>'
    + '<span><i class="d"></i>谷时价（另一口径）</span>'
    + '<span style="margin-left:auto">横轴取对数</span></div>';

  var smy = p.summary || {};
  var top = rows.filter(function(m){ return m.spread; })[0];
  var hint = '<p class="hint">同一个模型，各家卖的不是一个价：' + models.length + ' 个模型在 '
    + (smy.n_platforms || 0) + ' 个渠道上有 ' + lines.length + ' 条报价，价差中位 <b>'
    + (smy.spread_median || '—') + '×</b>'
    + (top ? '，最悬殊的是 <b>' + esc(top.display) + ' ' + top.spread.toFixed(1) + '×</b>' : '')
    + '。点一行展开逐家报价。</p>';

  var wb = (S.plans || []).filter(function(x){
    return /WorkBuddy/.test(x.platform) && x.convertible;
  }).sort(function(a, b){ return a.cny_per_1m - b.cny_per_1m; });
  var subs = '<div class="cm-subs">'
    + '<div class="k">订阅制渠道<span>按会员额度计费，没有按量价，不进上面这条价格带</span></div>'
    + '<div class="r2">'
    + wb.map(function(x){
        return '<span class="c">' + esc(x.platform) + ' '
          + esc(String(x.plan).replace(/\(.*$/, '')) + ' <b>¥' + money(x.cny_per_1m, 2) + '</b></span>';
      }).join('')
    + '<span class="c mut">Trae <b>未公布按量价</b></span>'
    + '</div>'
    + '<div class="f">WorkBuddy 那三个数是三档系数折算出的<b>等效单价</b>（元 / 百万 token），'
    + '随缓存命中率与输入输出比浮动，只用来判断「订阅到底省不省」，别和上面的按量 API 直接比大小。'
    + 'Trae 只有订阅档位、查不到 per-token 价，缺可比口径，暂不收录。</div>'
    + '</div>';

  var foot = '<div class="foot mt">点 = 一家渠道，同价合并、右侧 ×n 是家数；绿圈 = 这一行最低价。'
    + '官方谷时价与标准价不是同一商品，价差只按标准价算，逐家明细见「模型 × 平台报价」。</div>';

  return {
    meta: models.length + ' 模型 · ' + lines.length + ' 条渠道报价',
    body: hint + legend + '<div class="cm">' + axis + body + '</div>' + subs + foot
  };
};

/* ⑬ 平台排行 */
VIEW.platrank = function(){
  var p = S.panorama || {};
  var plats = (p.platforms || []).slice().sort(function(a, b){ return b.n_models - a.n_models; });
  if (!plats.length) return {meta:'', body:'<div class="empty">还没有平台库。</div>'};
  var ratioTxt = function(v){
    if (v == null) return '<span class="mut">—</span>';
    var d = (v - 1) * 100;
    if (Math.abs(d) < 0.5) return '<span class="mut">持平</span>';
    return '<span style="color:' + (d > 0 ? 'var(--bad)' : 'var(--ok)') + '">'
      + (d > 0 ? '+' : '') + d.toFixed(0) + '%</span>';
  };
  var KM = {official:'官方', cloud:'云厂商', aggregator:'第三方'};
  var t = table({
    id:'panoplat', rows:plats, empty:'',
    cols:[
      {k:'name', label:'平台', fmt:function(v, r){
          return '<span class="nm">' + esc(v) + '</span><span class="sm">' + esc(KM[r.kind] || r.kind) + '</span>'; }},
      {k:'n_models', label:'模型', cls:'r', num:true, fmt:function(v){ return v; }},
      {k:'ratio_median', label:'相对官方', cls:'r', num:true, fmt:function(v){ return ratioTxt(v); }},
      {k:'ratio_min', label:'最便宜', cls:'r', num:true, fmt:function(v){ return ratioTxt(v); }}
    ],
    foot:'相对官方 = 该平台当前输出价 ÷ 同模型官方价，取中位。只有 1 个模型的平台，中位就是它自己。'
  });
  return {meta: plats.length + ' 个平台', body: t};

/* ---------- 渲染 ---------- */
function render(){
  if (!S) return;
  Object.keys(VIEW).forEach(function(id){
    var box = $('b-' + id), meta = $('m-' + id);
    if (!box) return;
    try{
      var r = VIEW[id]() || {};
      box.innerHTML = r.body || '';
      if (meta) meta.innerHTML = r.meta || '';
    }catch(err){
      box.innerHTML = '<div class="empty">这张卡算不出来：' + esc(err.message || err) + '</div>';
      if (meta) meta.innerHTML = '';
    }
  });
  bind();
  bindPano();
}

/* 每次渲染后绑一次局部事件（筛选 / 搜索），别用 document 级委托堆监听 */
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'), function(b){
    b.onclick = function(){
      var s = b.getAttribute('data-st');
      if (!s) FLT.status.clear();
      else if (FLT.status.has(s)) FLT.status.delete(s);
      else FLT.status.add(s);
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-es]'), function(b){
    b.onclick = function(){
      var s = b.getAttribute('data-es');
      FLT.esrc = (FLT.esrc === s) ? '' : s;
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.xrow'), function(tr){
    /* 展开行语义上是个按钮：补 role / tabindex / aria-expanded，
       否则键盘和读屏用户永远看不到「每个平台的具体报价」 */
    var toggle = function(){
      var body = $(tr.getAttribute('data-x'));
      if (!body) return;
      var open = body.style.display !== 'none';
      body.style.display = open ? 'none' : '';
      tr.classList.toggle('open', !open);
      tr.setAttribute('aria-expanded', String(!open));
    };
    tr.onclick = toggle;
    tr.onkeydown = function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault();
        toggle();
      }
    };
  });
  /* 价格带的行：点开看这一行每家的确切报价 */
  Array.prototype.forEach.call(document.querySelectorAll('.cm-row'), function(el){
    var det = $(el.getAttribute('data-x'));
    if (!det) return;
    var toggle = function(){
      var open = det.style.display !== 'none';
      det.style.display = open ? 'none' : '';
      el.classList.toggle('open', !open);
      el.setAttribute('aria-expanded', String(!open));
    };
    el.onclick = toggle;
    el.onkeydown = function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault();
        toggle();
      }
    };
  });
  var q1 = $('apiQ'), q2 = $('evQ');
  [[q1, 'api'], [q2, 'ev']].forEach(function(pair){
    var el = pair[0];
    if (!el) return;
    var t = null;
    el.oninput = function(){
      clearTimeout(t);
      var v = el.value;
      t = setTimeout(function(){ FLT.q = v.trim(); render(); focusBack(pair[1], v); }, 260);
    };
  });
}
function focusBack(which, v){
  var el = which === 'api' ? $('apiQ') : $('evQ');
  if (!el) return;
  el.focus();
  try{ el.setSelectionRange(v.length, v.length); }catch(e){}
}

/* 平台全景图：点图例只看一个模型。线的 opacity 是 attribute，
   聚焦时用 style 覆盖、取消时清空 style 让它回落到 attribute，不用记住原值。 */
function bindPano(){
  Array.prototype.forEach.call(document.querySelectorAll('.chart svg[data-pano]'), function(svg){
    if (svg.dataset.bound) return;
    svg.dataset.bound = '1';
    var paint = function(model){
      Array.prototype.forEach.call(svg.querySelectorAll('[data-model]'), function(el){
        if (!model) el.style.opacity = '';
        else el.style.opacity = (el.getAttribute('data-model') === model) ? '1' : '0.12';
      });
      Array.prototype.forEach.call(svg.querySelectorAll('[data-legend]'), function(el){
        el.style.opacity = (!model || el.getAttribute('data-legend') === model)
          ? '' : '0.28';
      });
    };
    svg.addEventListener('click', function(e){
      var g = e.target.closest('[data-legend],[data-model]');
      if (!g) return;
      var m = g.getAttribute('data-legend') || g.getAttribute('data-model');
      svg.dataset.focus = svg.dataset.focus === m ? '' : m;
      paint(svg.dataset.focus);
    });
    svg.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ svg.dataset.focus = ''; paint(''); }
    });
  });
}

/* ---------- 报告弹层 ---------- */
function mdToHtml(md){
  var out = [], inList = false, inTable = false;
  md.split('\n').forEach(function(ln){
    var l = ln.replace(/\r$/, '');
    if (/^\s*$/.test(l)){ if (inList){ out.push('</ul>'); inList = false; }
      if (inTable){ out.push('</table>'); inTable = false; } return; }
    var t = esc(l)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    if (/^\|/.test(l)){
      if (/^\|[\s:-]+\|/.test(l)) return;
      if (!inTable){ out.push('<table>'); inTable = true; }
      var cells = l.split('|').slice(1, -1).map(function(c){ return c.trim(); });
      var tag = /^(模型|日期|类型|来源|指标)/.test(cells[0]) ? 'th' : 'td';
      out.push('<tr>' + cells.map(function(c){
        return '<' + tag + '>' + esc(c).replace(/`([^`]+)`/g, '<code>$1</code>') + '</' + tag + '>';
      }).join('') + '</tr>');
      return;
    }
    if (inTable){ out.push('</table>'); inTable = false; }
    if (/^#{1,3} /.test(l)){
      if (inList){ out.push('</ul>'); inList = false; }
      var n = l.match(/^#+/)[0].length;
      out.push('<h' + n + '>' + t.replace(/^#+\s*/, '') + '</h' + n + '>');
      return;
    }
    if (/^[-*] /.test(l)){
      if (!inList){ out.push('<ul>'); inList = true; }
      out.push('<li>' + t.replace(/^[-*]\s*/, '') + '</li>');
      return;
    }
    if (inList){ out.push('</ul>'); inList = false; }
    if (/^> /.test(l)){ out.push('<blockquote>' + t.replace(/^&gt;\s*/, '') + '</blockquote>'); return; }
    out.push('<p>' + t + '</p>');
  });
  if (inList) out.push('</ul>');
  if (inTable) out.push('</table>');
  return out.join('');
}
